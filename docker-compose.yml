version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: asistencia_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: BD2025jhon
      POSTGRES_DB: asistencia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: asistencia_app_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:BD2025jhon@database:5432/asistencia_db
      JWT_SECRET: clave_super_secreta_institucional_sjb_2026
    depends_on:
      - database

volumes:
  postgres_data:
